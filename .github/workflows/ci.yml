name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  # Zetta must run the same way on Linux, macOS and Windows, with or without Docker: unit tests run everywhere. Database-backed suites
  # run on Linux against a Postgres service and on macOS against the embedded Postgres (docs/decisions/embedded-postgres.md).
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    services:
      postgres:
        # The migrations create the pgvector extension, which the plain postgres image does not ship (same image as docker-compose.yml).
        image: ${{ matrix.os == 'ubuntu-latest' && 'pgvector/pgvector:pg18-trixie' || '' }}
        env: { POSTGRES_PASSWORD: password, POSTGRES_DB: zetta_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Migrate test database
        if: matrix.os == 'ubuntu-latest'
        working-directory: packages/db
        run: bunx drizzle-kit migrate
        env: { DATABASE_URL: "postgresql://postgres:password@127.0.0.1:5432/zetta_test" }
      - name: Embedded Postgres runtime
        if: matrix.os == 'macos-latest'
        run: bun run db:runtime
      - name: Embedded Postgres tests
        if: matrix.os == 'macos-latest'
        working-directory: packages/db
        run: bun test src/embedded
      - name: Server tests (database-backed on Linux and macOS)
        working-directory: apps/server
        run: bun test
        env:
          ZETTA_TEST_DB: ${{ matrix.os == 'macos-latest' && 'embedded' || '' }}
          ZETTA_CHAT_TEST_DATABASE_URL: ${{ matrix.os == 'ubuntu-latest' && 'postgresql://postgres:password@127.0.0.1:5432/zetta_test' || '' }}
          ZETTA_TEST_DATABASE_URL: ${{ matrix.os == 'ubuntu-latest' && 'postgresql://postgres:password@127.0.0.1:5432/zetta_test' || '' }}
          # Both only need a Postgres URL (the instance suite wants the migrations applied; LISTEN/NOTIFY writes no data).
          ZETTA_INSTANCE_TEST_DATABASE_URL: ${{ matrix.os == 'ubuntu-latest' && 'postgresql://postgres:password@127.0.0.1:5432/zetta_test' || '' }}
          ZETTA_SIGNALS_TEST_URL: ${{ matrix.os == 'ubuntu-latest' && 'postgresql://postgres:password@127.0.0.1:5432/zetta_test' || '' }}
      - name: Web build
        working-directory: apps/web
        run: bun run build
        # The build validates its environment (varlock), and the server address has no default.
        env: { ZETTA_SERVER_URL: "http://localhost:3000" }

  # Everything that needs no database or Docker: lint, typecheck and the unit suites of the web app, the packages and the tools.
  # Same steps as `bun run verify`. Formatting is checked only for what the pre-commit hook formats.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bash scripts/verify.sh
        env: { ZETTA_SERVER_URL: "http://localhost:3000" }

  # Public repo: hooks can be skipped locally, so CI enforces the same rules.
  public-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-public-hygiene.sh tracked
