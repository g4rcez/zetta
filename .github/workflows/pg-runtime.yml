name: pg-runtime
# Builds the Postgres runtime archives that Zetta unpacks when DATABASE_URL is empty (Postgres 18 + unaccent + pgvector, one per platform).
# See packages/db/scripts/pg-runtime.ts. Each job starts the archive it built and runs the extension checks before uploading it.
# A `pg-runtime-v*` tag also attaches the archives to a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["pg-runtime-v*"]
  pull_request:
    paths:
      - packages/db/scripts/pg-runtime.ts
      - packages/db/src/embedded/**
      - .github/workflows/pg-runtime.yml
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, platform: darwin-arm64 }
          - { os: macos-15-intel, platform: darwin-x64 }
          # The oldest Linux runners: pgvector then links against an older glibc and loads on more distributions.
          - { os: ubuntu-22.04, platform: linux-x64 }
          - { os: ubuntu-22.04-arm, platform: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential bison flex perl bzip2
      - name: Build and check the runtime
        run: bun run db:runtime
      - name: Embedded database tests
        working-directory: packages/db
        run: bun test src/embedded
      - uses: actions/upload-artifact@v4
        with:
          name: pg-runtime-${{ matrix.platform }}
          path: packages/db/.pg-runtime/*.tar.zst
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/pg-runtime-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: archives
          merge-multiple: true
      - name: Checksums
        working-directory: archives
        run: sha256sum *.tar.zst > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" archives/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "Postgres runtime archives for the embedded database."
