name: zetta

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      secrets:
        - web_env
        - server_env
      args:
        # The one public address: the web container serves the app and forwards /api to the server container. It comes from the .env next to
        # this file (install.sh writes it; `install.sh --url https://zetta.example.com` changes it everywhere), and the server reads the same
        # address from apps/server/.env.
        ZETTA_SERVER_URL: ${ZETTA_SERVER_URL:-http://localhost:3001}
    init: true
    ports:
      # The one port people use. ZETTA_WEB_PORT in the .env next to this file moves it when 3001 is taken (install.sh --port).
      - "${ZETTA_WEB_PORT:-3001}:80"
    env_file:
      - path: apps/web/.env
        required: false
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      secrets:
        - web_env
        - server_env
      args:
        # Which version this image is: the commit and its date. install.sh sets them from git; without them Zetta reports "Version unknown".
        ZETTA_BUILD_COMMIT: ${ZETTA_BUILD_COMMIT:-}
        ZETTA_BUILD_DATE: ${ZETTA_BUILD_DATE:-}
        # The agent CLIs bots run on, installed in the image: claude-code, codex, both (the default) or none.
        ZETTA_AGENTS: ${ZETTA_AGENTS:-claude-code codex}
    init: true
    ports:
      # The raw API is for this computer only; people reach Zetta through the web container above. Set ZETTA_API_BIND=0.0.0.0 to open it.
      - "${ZETTA_API_BIND:-127.0.0.1}:${ZETTA_API_PORT:-3000}:3000"
    env_file:
      - path: apps/server/.env
        required: false
    environment:
      # ZETTA_SERVER_URL is not set here: apps/server/.env is its one source (docs/operations/settings.md).
      ZETTA_HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/zetta
      # Everything the server keeps on disk lives on the zetta_data volume, so an update does not erase it: HOME holds the bots' code folders,
      # attachments, artifacts, model caches and the agent CLIs' sign-ins (~/.claude, ~/.codex); ZETTA_FILES_ROOT holds the files store.
      HOME: /data/home
      ZETTA_FILES_ROOT: /data/files
    volumes:
      - zetta_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg18-trixie
    container_name: zetta-postgres
    environment:
      POSTGRES_DB: zetta
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - zetta_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  zetta_postgres_data:
  zetta_data:

# BuildKit makes these available only while install/build commands run.
secrets:
  web_env:
    file: apps/web/.env
  server_env:
    file: apps/server/.env
